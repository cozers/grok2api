name: Build FreeBSD Binary

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to publish, for example v2.0.4-freebsd. Leave empty to build artifact only."
        required: false
        type: string
  push:
    branches: [main]
    tags: ["v*"]
  schedule:
    - cron: "35 20 * * *"

jobs:
  build-freebsd:
    name: FreeBSD amd64
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.release_tag }}" ]; then
            echo "tag=${{ inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Start FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14.3"
          usesh: true
          sync: nfs
          prepare: |
            mkdir -p /usr/local/etc/pkg/repos
            printf 'FreeBSD: { url: "pkg+https://pkg.FreeBSD.org/${ABI}/latest" }\n' > /usr/local/etc/pkg/repos/FreeBSD.conf
            pkg update -f
            pkg install -y python313 py313-sqlite3 rust pkgconf libffi openssl sqlite3 curl gmake cmake ninja autoconf automake libtool

      - name: Build in FreeBSD
        shell: freebsd {0}
        run: |
          rm -f freebsd-build.ok freebsd-build.status freebsd-build.log freebsd-build.sh
          cat > freebsd-build.sh <<'SH'
          #!/bin/sh
          set -eux
          freebsd-version
          python3.13 --version
          python3.13 -c 'import _sqlite3, sqlite3; print("sqlite3 ok", sqlite3.sqlite_version)'
          cargo --version
          python3.13 -m ensurepip --upgrade || true
          python3.13 -m pip --version || fetch -o /tmp/get-pip.py https://bootstrap.pypa.io/get-pip.py
          python3.13 -m pip --version || python3.13 /tmp/get-pip.py
          python3.13 -m pip install --upgrade pip
          python3.13 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -c 'import tomllib; deps=tomllib.load(open("pyproject.toml","rb"))["project"]["dependencies"]; print("\n".join(dep.split("#", 1)[0].strip() for dep in deps if not dep.startswith("curl-cffi")))' > /tmp/grok2api-requirements.txt
          ! grep -i '^curl-cffi' /tmp/grok2api-requirements.txt
          python -m pip install -r /tmp/grok2api-requirements.txt
          PYINSTALLER_COMPILE_BOOTLOADER=1 python -m pip install --no-binary pyinstaller pyinstaller
          python -m PyInstaller \
            --clean \
            --onefile \
            --name grok2api \
            --collect-submodules app \
            --collect-data app \
            --collect-data tiktoken \
            --collect-all granian \
            --collect-all uvicorn \
            --collect-all websockets \
            --hidden-import _sqlite3 \
            --hidden-import sqlite3 \
            --hidden-import h11 \
            --add-data config.defaults.toml:. \
            --add-data pyproject.toml:. \
            packaging/freebsd/launcher.py
          binary_size=$(stat -f %z dist/grok2api)
          echo "PyInstaller binary size: ${binary_size} bytes"
          test "$binary_size" -gt 5000000
          mkdir -p dist/grok2api-freebsd-amd64
          cp dist/grok2api dist/grok2api-freebsd-amd64/grok2api
          cp config.defaults.toml .env.example dist/grok2api-freebsd-amd64/
          cp packaging/freebsd/start.sh dist/grok2api-freebsd-amd64/start.sh
          cp packaging/freebsd/README.serv00.md dist/grok2api-freebsd-amd64/README.serv00.md
          chmod +x dist/grok2api-freebsd-amd64/grok2api dist/grok2api-freebsd-amd64/start.sh
          tar -C dist -czf dist/grok2api-freebsd-amd64.tar.gz grok2api-freebsd-amd64
          ./dist/grok2api-freebsd-amd64/grok2api --help >/tmp/grok2api-help.txt || true
          GROK2API_FREEBSD_SELF_TEST=1 ./dist/grok2api-freebsd-amd64/grok2api
          touch freebsd-build.ok
          SH
          chmod +x freebsd-build.sh
          set +e
          ./freebsd-build.sh > freebsd-build.log 2>&1
          status=$?
          echo "$status" > freebsd-build.status
          cat freebsd-build.log
          rm -rf .venv build __pycache__ .pytest_cache
          rm -f grok2api.spec
          exit 0

      - name: Copy FreeBSD outputs
        if: always()
        shell: freebsd {0}
        run: |
          set +e
          ls -la
          test -f freebsd-build.log || echo "freebsd-build.log missing" > freebsd-build.log
          test -d dist || mkdir -p dist

      - name: Append FreeBSD log summary
        if: always()
        shell: bash
        run: |
          {
            echo "## FreeBSD build log tail"
            echo
            echo '```text'
            if [ -f freebsd-build.log ]; then
              tail -n 200 freebsd-build.log
            else
              echo "freebsd-build.log missing"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grok2api-freebsd-amd64
          path: |
            dist/grok2api-freebsd-amd64.tar.gz
            freebsd-build.log
          if-no-files-found: warn

      - name: Detect FreeBSD build result
        if: always()
        id: freebsd_result
        shell: bash
        run: |
          if [ -f freebsd-build.ok ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish FreeBSD debug log
        if: steps.release.outputs.tag != '' && steps.freebsd_result.outputs.ok != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.tag }}
          files: freebsd-build.log
          overwrite_files: true
          body: |
            FreeBSD build did not complete. Download `freebsd-build.log` from assets for the latest failure details.
          generate_release_notes: false

      - name: Check FreeBSD build result
        run: |
          test -f freebsd-build.ok

      - name: Publish GitHub Release
        if: steps.release.outputs.tag != '' && steps.freebsd_result.outputs.ok == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.tag }}
          files: dist/grok2api-freebsd-amd64.tar.gz
          overwrite_files: true
          generate_release_notes: true
